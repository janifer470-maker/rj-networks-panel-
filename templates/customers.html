{% extends 'base.html' %}{% block content %}<h1>Customers</h1><section class="card"><h2>Add Customer</h2><form method="post" action="/customers/add" class="grid"><label>Name<input name="name" required></label><label>WhatsApp number<input name="phone" placeholder="923001234567"></label><label>Area<input name="area"></label><label>Package<input name="package" placeholder="50 Mbps"></label><label>Monthly fee<input name="fee" type="number" step="0.01" value="0"></label><label>Expiry date<input name="expiry" type="date"></label><label class="wide">Notes<input name="notes"></label><button class="wide">Save Customer</button></form></section><section class="card"><form method="get"><input name="q" value="{{q}}" placeholder="Search name, phone or area"><button>Search</button></form><table><tr><th>Name</th><th>Phone</th><th>Area</th><th>Package</th><th>Fee</th><th>Expiry</th><th>WhatsApp</th></tr>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.phone}}</td><td>{{u.area}}</td><td>{{u.package}}</td><td>{{u.fee}}</td><td>{{u.expiry}}</td><td>{% if u.phone %}<a target="_blank" href="https://wa.me/{{u.phone|replace('+','')|replace(' ','')}}?text={{('Assalam-o-Alaikum '+u.name+', RJ Networks package '+(u.package or '')+' ki expiry '+(u.expiry or 'qareeb')+' hai. Fee jama karwa dein. Shukriya.')|urlencode}}">Message</a>{% endif %}</td></tr>{% endfor %}</table></section>{% endblock %}
