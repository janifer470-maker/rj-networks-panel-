{% extends 'base.html' %}{% block content %}<h1>Payments / Recovery</h1><section class="card"><form method="post" class="grid"><label>Customer<select name="user_id" required>{% for u in users %}<option value="{{u.id}}">{{u.name}} — {{u.phone}}</option>{% endfor %}</select></label><label>Amount<input name="amount" type="number" step="0.01" required></label><label>Method<select name="method"><option>Cash</option><option>Easypaisa</option><option>JazzCash</option><option>Bank</option></select></label><label>Date<input name="paid_on" type="date" value="{{today}}"></label><label class="wide">Note<input name="note"></label><button class="wide">Save Payment</button></form></section><section class="card"><h2>Payment history</h2><table><tr><th>Date</th><th>Customer</th><th>Phone</th><th>Amount</th><th>Method</th><th>Note</th></tr>{% for p in rows %}<tr><td>{{p.paid_on}}</td><td>{{p.name}}</td><td>{{p.phone}}</td><td>Rs {{p.amount}}</td><td>{{p.method}}</td><td>{{p.note}}</td></tr>{% endfor %}</table></section>{% endblock %}
